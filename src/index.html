<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>GAS CI/CD Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .version { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 0.75rem; padding: 0.5rem 1rem; background: #1a73e8; color: white; border: 0; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button:disabled { background: #999; cursor: not-allowed; }
    #result { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; }
    .ok { background: #e6f4ea; color: #137333; }
    .err { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <h1><?= greeting ?></h1>
  <div class="version">build: <?= appVersion ?></div>

  <label for="name">Your name</label>
  <input id="name" type="text" placeholder="e.g. Justin" maxlength="64">
  <button id="go">Greet me</button>

  <div id="result" hidden></div>

  <script>
    const $ = (id) => document.getElementById(id);

    $('go').addEventListener('click', () => {
      const name = $('name').value;
      const btn = $('go');
      const out = $('result');

      btn.disabled = true;
      out.hidden = true;
      out.className = '';

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          out.hidden = false;
          out.textContent = res.message;
          out.className = res.success ? 'ok' : 'err';
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          out.hidden = false;
          out.textContent = 'Server error: ' + err.message;
          out.className = 'err';
        })
        .getPersonalGreeting(name);
    });
  </script>
</body>
</html>
